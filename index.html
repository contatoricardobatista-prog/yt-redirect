<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f9f9f9;
      color: #555;
    }
    .box {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 15px; }
    a { color: #ff0000; text-decoration: none; font-size: 14px; margin-top: 1rem; display: inline-block; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Abrindo no YouTube...</p>
    <a id="fallbackLink" href="#" style="display:none">Clique aqui se não abrir</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var v = params.get('v');

      if (!v) {
        window.location.href = 'https://www.youtube.com';
        return;
      }

      var fallback = 'https://www.youtube.com/watch?v=' + v;
      var ua = navigator.userAgent;

      var fallbackLink = document.getElementById('fallbackLink');
      fallbackLink.href = fallback;

      var timer = setTimeout(function () {
        fallbackLink.style.display = 'inline-block';
        window.location.href = fallback;
      }, 1500);

      if (/iPhone|iPad|iPod/.test(ua)) {
        window.location.href = 'youtube://watch?v=' + v;
      } else if (/Android/.test(ua)) {
        window.location.href = 'intent://watch?v=' + v +
          '#Intent;scheme=vnd.youtube;package=com.google.android.youtube;end';
      } else {
        clearTimeout(timer);
        window.location.href = fallback;
      }
    })();
  </script>
</body>
</html>
